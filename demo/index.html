        <p>KCSA Studio · São Paulo</p>
        <h1>Kelvin Carlos</h1>
        <p>Fotógrafo e profissional de audiovisual.</p>
        <p>
          Eu sou Kelvin Carlos, fotógrafo e profissional de audiovisual, com
          formação em Produção Audiovisual, Línguas e Fotografia. Aos 20 anos,
          transformei minha paixão por imagens em uma forma de contar histórias,
          criar experiências e eternizar momentos.
        </p>
        <p>
          Minha base é São Paulo, mas meu trabalho pode chegar até você. Viajo
          para diferentes estados para fotografar pessoas, projetos e histórias
          que merecem ser vistas de um jeito único.
        </p>
        <h2>Serviços</h2>
        <ul>
          <li>Ensaios. Retratos, ensaios individuais, casal, família ou projetos autorais. Uma experiência pensada para traduzir sua personalidade em imagens.</li>
          <li>Eventos. A espontaneidade de cada momento, a energia do ambiente e aqueles detalhes que passam rápido demais para serem percebidos.</li>
          <li>Casamentos. Mais do que registrar uma cerimônia, contar a história de um dia inteiro através de emoções, encontros e pequenos detalhes.</li>
          <li>Retratos. Imagens que comunicam presença, personalidade e identidade — seja para uso pessoal ou profissional.</li>
          <li>Corporativo. Fotografia profissional para pessoas, marcas, equipes e empresas que precisam comunicar quem são através da imagem.</li>
          <li>Audiovisual. Além da fotografia, desenvolvo projetos audiovisuais que unem movimento, narrativa, estética e identidade.</li>
        </ul>
